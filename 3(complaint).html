<!DOCTYPE html>
<html>
<head>
<title>Complaint Form</title>
</head>
<body>

<h2>Complaint Form</h2>

<form onsubmit="submitForm(event)">

    <input id="fname" placeholder="First Name"><br><br>
    <input id="lname" placeholder="Last Name"><br><br>
    <input id="email" type="email" placeholder="Email"><br><br>

    <select id="device">
        <option value="">Select Device</option>
        <option>Mobile Phone</option>
        <option>Television</option>
        <option>Computer/Laptop</option>
        <option>Home Electronics</option>
    </select><br><br>

    <p>Is your device under warranty?</p>
    <input type="radio" name="warranty" value="Yes"> Yes
    <input type="radio" name="warranty" value="No"> No<br><br>

    <button type="submit">Submit</button>
</form>

<div id="result"></div>

<script>
function submitForm(e) {
    e.preventDefault();

    if(fname.value.trim() == "") {
        alert("Please enter your first name");
        return;
    }

    let warranty = document.querySelector(
        'input[name="warranty"]:checked'
    );

    result.innerHTML =
        "<h3>Complaint Submitted</h3>" +
        "Name: " + fname.value + " " + lname.value +
        "<br>Email: " + email.value +
        "<br>Device: " + device.value +
        "<br>Warranty: " + (warranty ? warranty.value : "Not selected");
}
</script>

</body>
</html>
