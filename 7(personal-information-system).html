<!DOCTYPE html>
<html>
<head>
<title>Personal Information System</title>
</head>
<body>

<h2>Personal Information System</h2>

<form id="form">
    <input id="name" placeholder="Name" required><br><br>
    <input id="email" type="email" placeholder="Email" required><br><br>
    <input id="phone" placeholder="Phone" required><br><br>
    <button type="submit">Add Person</button>
</form>

<h3>People List</h3>

<table border="1" align="center">
    <thead>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="list"></tbody>
</table>

<script>
form.onsubmit = function(e) {
    e.preventDefault();

    let row = list.insertRow();

    row.innerHTML =
        `<td>${name.value}</td>
         <td>${email.value}</td>
         <td>${phone.value}</td>
         <td><button onclick="this.parentElement.parentElement.remove()">Delete</button></td>`;

    form.reset();
};
</script>

</body>
</html>
